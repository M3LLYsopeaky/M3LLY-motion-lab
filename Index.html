<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melly Motion Lab</title>
<style>
:root { color-scheme: dark; --cyan:#20eaff; --purple:#9d4dff; }
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; overflow:hidden; display:grid; place-items:center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(ellipse at 15% 20%, #18265d 0, transparent 38%),
              radial-gradient(ellipse at 85% 80%, #35104d 0, transparent 40%),
              linear-gradient(135deg,#050711,#090b1c 55%,#050611);
  color:white;
}
body:before {
 content:""; position:fixed; inset:0; pointer-events:none; opacity:.23;
 background-image:linear-gradient(#5e7cff22 1px,transparent 1px),linear-gradient(90deg,#5e7cff22 1px,transparent 1px);
 background-size:42px 42px; mask-image:linear-gradient(to bottom,black,transparent 90%);
}
.profile-link {
 position:fixed; top:20px; right:20px; z-index:5; display:flex; align-items:center; gap:10px;
 color:#fff; text-decoration:none; font-weight:650; letter-spacing:.2px;
}
.display-name { text-shadow:0 0 14px #20eaff88; }
.profile {
 display:block; width:54px;height:54px; border-radius:50%; padding:3px;
 border:1px solid #ffffff66; background:linear-gradient(135deg,var(--cyan),var(--purple));
 box-shadow:0 0 22px #20eaff66; overflow:hidden;
}
.profile img {width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
main { width:min(560px, calc(100vw - 34px)); display:flex; flex-direction:column; gap:18px; }
.glass {
 width:100%; min-height:76px; border:1px solid #ffffff38; border-radius:23px;
 color:#fff; font-size:clamp(19px,4vw,24px); font-weight:650; letter-spacing:.2px;
 background:linear-gradient(135deg,#ffffff22,#ffffff08 55%,#a9c8ff12);
 backdrop-filter:blur(24px) saturate(165%); -webkit-backdrop-filter:blur(24px) saturate(165%);
 box-shadow:inset 0 1px 1px #ffffff55, 0 12px 35px #0008, 0 0 22px #754dff22;
 cursor:pointer; transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.glass:active {transform:scale(.975);}
.glass.is-active {
  animation: cubic-pop 620ms cubic-bezier(.22,1,.36,1) both;
  border-color:#70f2ff;
  box-shadow:inset 0 1px 1px #ffffff88,0 0 34px #20eaff66,0 14px 38px #0009;
}
@keyframes cubic-pop {
  0% { transform:scale(1); filter:brightness(1); }
  38% { transform:scale(1.045); filter:brightness(1.3); }
  72% { transform:scale(.99); }
  100% { transform:scale(1); filter:brightness(1); }
}
.glass:hover {border-color:#6ceeffaa;box-shadow:inset 0 1px 1px #ffffff77,0 0 28px #20eaff33;}
#status {position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;opacity:.75;font-size:12px;}

.editor { width:min(620px,calc(100vw - 30px)); display:flex; flex-direction:column; gap:14px; z-index:1; }
.hidden { display:none !important; }
.editor-top { display:flex; align-items:center; justify-content:space-between; font-size:18px; font-weight:700; }
.small { width:auto; min-height:42px; padding:0 16px; font-size:14px; border-radius:14px; }
.import { display:grid; place-items:center; min-height:58px; font-size:17px; font-weight:650; cursor:pointer; }
.preview { position:relative; width:100%; aspect-ratio:16/9; border:1px solid #ffffff35; border-radius:20px; overflow:hidden; background:linear-gradient(135deg,#10172d,#080a14); display:grid; place-items:center; color:#ffffff88; text-align:center; padding:10px; }
.preview video { width:100%; height:100%; object-fit:contain; display:none; }
.control-card { padding:18px; border:1px solid #ffffff30; border-radius:20px; background:linear-gradient(135deg,#ffffff18,#ffffff08); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:inset 0 1px 1px #ffffff35,0 10px 30px #0006; }
.control-heading { display:flex; justify-content:space-between; align-items:center; font-weight:650; margin-bottom:14px; }
.control-heading strong { color:#8df5ff; font-variant-numeric:tabular-nums; }
input[type=range] { width:100%; accent-color:#48eaff; }
.range-labels { display:flex; justify-content:space-between; color:#ffffff88; font-size:12px; margin-top:5px; }
.shake-preview { animation: preview-shake .18s steps(2,end) infinite; }
@keyframes preview-shake { 0%{transform:translate(0,0)} 25%{transform:translate(2px,-1px)} 50%{transform:translate(-2px,1px)} 75%{transform:translate(1px,2px)} 100%{transform:translate(0,0)} }
.hint { margin:0; text-align:center; color:#ffffff88; font-size:12px; }
@media(max-width:520px) { .editor-top { font-size:16px; } .control-card { padding:15px; } }
\n@media(prefers-reduced-motion:no-preference) {
 body:after {content:"";position:fixed;inset:-30%;pointer-events:none;background:conic-gradient(from 90deg at 50% 50%,transparent,#4b54ff12,transparent,#13eaff10,transparent);filter:blur(70px);animation:drift 16s linear infinite;}
 @keyframes drift {to{transform:rotate(360deg)}}
}

/* iOS-inspired spring transitions */
#home, #editor {
  transform-origin: 50% 45%;
  will-change: transform, opacity, filter;
}
#home.screen-exit {
  animation: home-out 420ms cubic-bezier(.32,0,.18,1) both;
  pointer-events: none;
}
#editor.screen-enter {
  animation: editor-in 680ms cubic-bezier(.16,1,.3,1) both;
}
#editor.screen-exit {
  animation: editor-out 330ms cubic-bezier(.4,0,1,1) both;
  pointer-events: none;
}
#home.screen-enter {
  animation: home-in 620ms cubic-bezier(.16,1,.3,1) both;
}
@keyframes home-out {
  0% { opacity:1; transform:scale(1) translateY(0); filter:blur(0); }
  100% { opacity:0; transform:scale(.92) translateY(18px); filter:blur(9px); }
}
@keyframes editor-in {
  0% { opacity:0; transform:translateY(42px) scale(.94); filter:blur(12px); }
  65% { opacity:1; transform:translateY(-4px) scale(1.012); filter:blur(0); }
  100% { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}
@keyframes editor-out {
  0% { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  100% { opacity:0; transform:translateY(24px) scale(.96); filter:blur(8px); }
}
@keyframes home-in {
  0% { opacity:0; transform:scale(1.045) translateY(-12px); filter:blur(8px); }
  100% { opacity:1; transform:scale(1) translateY(0); filter:blur(0); }
}
.glass {
  transition: transform 520ms cubic-bezier(.2,.9,.25,1.25),
              background 350ms ease, border-color 350ms ease,
              box-shadow 450ms cubic-bezier(.16,1,.3,1);
  -webkit-tap-highlight-color: transparent;
}
.glass:active {
  transform:scale(.955);
  background:linear-gradient(135deg,#ffffff35,#ffffff12);
  box-shadow:inset 0 1px 2px #ffffff88,0 0 32px #20eaff55;
}
.editor > * {
  animation: item-arrive 650ms cubic-bezier(.16,1,.3,1) both;
}
.editor > *:nth-child(2) { animation-delay:45ms; }
.editor > *:nth-child(3) { animation-delay:85ms; }
.editor > *:nth-child(4) { animation-delay:125ms; }
.editor > *:nth-child(5) { animation-delay:165ms; }
@keyframes item-arrive {
  from { opacity:0; transform:translateY(13px); }
  to { opacity:1; transform:translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  #home, #editor, .editor > *, .glass { animation:none !important; transition:none !important; }
}

</style>

<main id="home">
  <button class="glass" data-tool="motion">Motion Blur</button>
  <button class="glass" data-tool="shake">Auto Shake</button>
  <button class="glass" data-tool="quality">Enhance Quality</button>
</main>

<section id="editor" class="editor hidden" aria-live="polite">
  <div class="editor-top">
    <button class="back glass small" id="back">← Back</button>
    <span id="editor-title">Motion Blur</span>
  </div>
  <label class="import glass" for="video-file">＋ Import Video</label>
  <input id="video-file" type="file" accept="video/*" hidden>
  <div class="preview" id="preview">
    <video id="video-preview" controls playsinline></video>
    <div id="empty-preview">Your video preview will appear here</div>
  </div>
  <div class="control-card" id="blur-controls">
    <div class="control-heading"><span>Motion Blur</span><strong><span id="blur-value">20</span>%</strong></div>
    <input id="blur-slider" type="range" min="20" max="70" value="20">
    <div class="range-labels"><span>20%</span><span>70%</span></div>
  </div>
  <div class="control-card hidden" id="shake-controls">
    <div class="control-heading"><span>Shake intensity</span><strong><span id="shake-value">30</span>%</strong></div>
    <input id="shake-slider" type="range" min="0" max="100" value="30">
    <button class="glass small" id="shake-toggle">Enable Auto Shake</button>
  </div>
  <div class="control-card hidden" id="quality-controls">
    <div class="control-heading"><span>Enhance quality</span><strong><span id="quality-value">100</span>%</strong></div>
    <input id="quality-slider" type="range" min="100" max="150" value="100">
    <div class="range-labels"><span>100%</span><span>150%</span></div>
  </div>
  <p class="hint">Adjust the effect and preview it on your video.</p>
</section>
<script>
const home = document.getElementById('home');
const editor = document.getElementById('editor');
const title = document.getElementById('editor-title');
const videoInput = document.getElementById('video-file');
const video = document.getElementById('video-preview');
const emptyPreview = document.getElementById('empty-preview');

function openEditor(tool, button) {
  button.classList.add('is-active');
  title.textContent = button.textContent;
  document.getElementById('blur-controls').classList.toggle('hidden', tool !== 'motion');
  document.getElementById('shake-controls').classList.toggle('hidden', tool !== 'shake');
  document.getElementById('quality-controls').classList.toggle('hidden', tool !== 'quality');

  home.classList.remove('screen-enter', 'screen-exit');
  editor.classList.remove('screen-enter', 'screen-exit', 'hidden');
  home.classList.add('screen-exit');

  window.setTimeout(() => {
    home.classList.add('hidden');
    home.classList.remove('screen-exit');
    editor.classList.add('screen-enter');
    window.setTimeout(() => editor.classList.remove('screen-enter'), 700);
  }, 300);
}

document.querySelectorAll('#home .glass').forEach(button => {
  button.addEventListener('click', () => openEditor(button.dataset.tool, button));
});

document.getElementById('back').addEventListener('click', () => {
  editor.classList.remove('screen-enter', 'screen-exit');
  home.classList.remove('screen-enter', 'screen-exit', 'hidden');
  editor.classList.add('screen-exit');

  window.setTimeout(() => {
    editor.classList.add('hidden');
    editor.classList.remove('screen-exit');
    home.classList.add('screen-enter');
    window.setTimeout(() => home.classList.remove('screen-enter'), 650);
  }, 250);
});

videoInput.addEventListener('change', () => {
  const file = videoInput.files && videoInput.files[0];
  if (!file) return;
  video.src = URL.createObjectURL(file);
  video.style.display = 'block';
  emptyPreview.style.display = 'none';
  video.load();
});

const blurSlider = document.getElementById('blur-slider');
blurSlider.addEventListener('input', () => {
  const value = Number(blurSlider.value);
  document.getElementById('blur-value').textContent = value;
  // A lightweight browser preview approximation of the blur strength.
  video.style.filter = `blur(${(value - 20) / 25}px)`;
});

const shakeSlider = document.getElementById('shake-slider');
shakeSlider.addEventListener('input', () => {
  document.getElementById('shake-value').textContent = shakeSlider.value;
});

let shakeEnabled = false;
document.getElementById('shake-toggle').addEventListener('click', event => {
  shakeEnabled = !shakeEnabled;
  event.currentTarget.textContent = shakeEnabled ? 'Disable Auto Shake' : 'Enable Auto Shake';
  video.classList.toggle('shake-preview', shakeEnabled);
});

const qualitySlider = document.getElementById('quality-slider');
qualitySlider.addEventListener('input', () => {
  document.getElementById('quality-value').textContent = qualitySlider.value;
  video.style.filter = `contrast(${qualitySlider.value}%) saturate(${qualitySlider.value}%)`;
});
</script>
</body>
</html>
